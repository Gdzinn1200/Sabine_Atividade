spring.application.name=agendapro

# Banco de dados: ajuste usuario e senha em application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/agendapro?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Perfil local (nao versionado) sobrescreve o acesso ao banco
spring.profiles.active=local

spring.thymeleaf.cache=false
server.port=8080
