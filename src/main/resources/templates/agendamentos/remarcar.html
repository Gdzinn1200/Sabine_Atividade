<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Remarcar agendamento')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: topo}"></nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-3 mb-3">
    <div class="card-title">Remarcando o agendamento #<span th:text="${agendamento.id}">0</span></div>
    <p class="mb-2">
      <b th:text="${agendamento.cliente.nome}">Cliente</b> -
      <span th:text="${agendamento.servico.nome}">Servico</span> com
      <span th:text="${agendamento.profissional.nome}">Profissional</span>.
      Atualmente em <b th:text="${agendamento.dataFormatada} + ' as ' + ${agendamento.horaInicioFormatada}">data</b>.
    </p>
    <form class="row g-2 align-items-end" method="get"
          th:action="@{/agendamentos/{id}/remarcar(id=${agendamento.id})}">
      <div class="col-md-3">
        <label class="form-label">Nova data</label>
        <input class="form-control" type="date" name="data" th:value="${data}">
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-primary" type="submit">Ver horarios</button>
      </div>
    </form>
  </div>

  <div class="card p-3">
    <div class="card-title">Horarios disponiveis</div>
    <div th:if="${livres == 0}" class="vazio">
      <p>Nenhum horario livre nesta data. Escolha outra data.</p>
    </div>
    <form th:if="${livres > 0}" method="post"
          th:action="@{/agendamentos/{id}/remarcar(id=${agendamento.id})}">
      <input type="hidden" name="data" th:value="${data}">
      <div class="slots mb-3">
        <span th:each="h : ${horarios}">
          <button th:if="${h.livre}" class="slot" type="submit" name="hora" th:value="${h.rotulo}"
                  th:text="${h.rotulo}">00:00</button>
          <span th:unless="${h.livre}" class="slot off" th:title="${h.motivo}"
                th:text="${h.rotulo}">00:00</span>
        </span>
      </div>
      <div class="form-text">O horario atual continua reservado ate a confirmacao da remarcacao.</div>
    </form>
    <div class="mt-3">
      <a class="btn btn-outline-primary"
         th:href="@{/agendamentos/{id}(id=${agendamento.id})}">Voltar</a>
    </div>
  </div>

  <footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</div>
</body>
</html>
