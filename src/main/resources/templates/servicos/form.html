<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de servico &middot; AgendaPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/agendapro.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-agendapro mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Agenda<span>Pro</span></a>
    <div class="navbar-nav flex-wrap">
      <a class="nav-link" th:href="@{/}">Inicio</a>
      <a class="nav-link" th:href="@{/agenda}">Agenda</a>
      <a class="nav-link" th:href="@{/agendamentos/novo}">Novo agendamento</a>
      <a class="nav-link" th:href="@{/clientes}">Clientes</a>
      <a class="nav-link" th:href="@{/profissionais}">Profissionais</a>
      <a class="nav-link active" th:href="@{/servicos}">Servicos</a>
      <a class="nav-link" th:href="@{/horarios}">Horarios</a>
    </div>
  </div>
</nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-4">
    <div class="card-title" th:text="${servico.id == null} ? 'Novo servico' : 'Editar servico'">Novo servico</div>
    <form th:action="@{/servicos}" method="post" th:object="${servico}">
      <input type="hidden" th:field="*{id}">
      <input type="hidden" th:field="*{ativo}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nome <span class="obrigatorio">*</span></label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('nome')} ? 'is-invalid'"
                 type="text" th:field="*{nome}">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('nome')}"
               th:text="${erros['nome']}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Duracao (minutos) <span class="obrigatorio">*</span></label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('duracaoMinutos')} ? 'is-invalid'"
                 type="number" min="5" step="5" th:field="*{duracaoMinutos}">
          <div class="form-text">Define o horario final do atendimento (RN03).</div>
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('duracaoMinutos')}"
               th:text="${erros['duracaoMinutos']}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Preco <span class="obrigatorio">*</span></label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('preco')} ? 'is-invalid'"
                 type="number" min="0" step="0.01" th:field="*{preco}">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('preco')}"
               th:text="${erros['preco']}"></div>
        </div>
        <div class="col-12">
          <label class="form-label">Descricao</label>
          <input class="form-control" type="text" th:field="*{descricao}">
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-primary" th:href="@{/servicos}">Voltar</a>
      </div>
    </form>
  </div>

  <footer class="mt-5 mb-4">
    AgendaPro &middot; Equipe 1 &middot; Fabrica de Software &middot; entrega de 06/11/2026
  </footer>
</div>
</body>
</html>
