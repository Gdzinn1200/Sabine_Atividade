<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de profissional &middot; AgendaPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/agendapro.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-agendapro mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Agenda<span>Pro</span></a>
    <div class="navbar-nav flex-wrap">
      <a class="nav-link" th:href="@{/}">Inicio</a>
      <a class="nav-link" th:href="@{/agenda}">Agenda</a>
      <a class="nav-link" th:href="@{/agendamentos/novo}">Novo agendamento</a>
      <a class="nav-link" th:href="@{/clientes}">Clientes</a>
      <a class="nav-link active" th:href="@{/profissionais}">Profissionais</a>
      <a class="nav-link" th:href="@{/servicos}">Servicos</a>
      <a class="nav-link" th:href="@{/horarios}">Horarios</a>
    </div>
  </div>
</nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-4">
    <div class="card-title"
         th:text="${profissional.id == null} ? 'Novo profissional' : 'Editar profissional'">Novo</div>
    <form th:action="@{/profissionais}" method="post">
      <input type="hidden" name="id" th:value="${profissional.id}">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label">Nome completo <span class="obrigatorio">*</span></label>
          <input class="form-control" type="text" name="nome" th:value="${profissional.nome}"
                 th:classappend="${erros != null and erros.containsKey('nome')} ? 'is-invalid'">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('nome')}"
               th:text="${erros['nome']}"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Telefone <span class="obrigatorio">*</span></label>
          <input class="form-control" type="text" name="telefone" th:value="${profissional.telefone}"
                 placeholder="(00) 00000-0000"
                 th:classappend="${erros != null and erros.containsKey('telefone')} ? 'is-invalid'">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('telefone')}"
               th:text="${erros['telefone']}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">E-mail</label>
          <input class="form-control" type="text" name="email" th:value="${profissional.email}">
        </div>
      </div>

      <div class="mt-3">
        <label class="form-label">Servicos que executa <span class="obrigatorio">*</span></label>
        <div class="row g-2">
          <div class="col-md-4" th:each="s : ${servicos}">
            <label class="d-flex gap-2 align-items-center">
              <input type="checkbox" name="servicosSelecionados" th:value="${s.id}"
                     th:checked="${selecionados.contains(s.id)}">
              <span th:text="${s.nome} + ' (' + ${s.duracaoMinutos} + ' min)'">Servico</span>
            </label>
          </div>
        </div>
        <div class="form-text">Define quem pode ser escolhido no agendamento (RN06).</div>
        <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('servicos')}"
             th:text="${erros['servicos']}"></div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-primary" th:href="@{/profissionais}">Voltar</a>
      </div>
    </form>
  </div>

  <footer class="mt-5 mb-4">
    AgendaPro &middot; Equipe 1 &middot; Fabrica de Software &middot; entrega de 06/11/2026
  </footer>
</div>
</body>
</html>
