<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Redefinir senha')}"></head>
<body class="tela-acesso">
<div class="container">
  <div class="caixa-acesso">
    <div class="marca">Agenda<span>Pro</span></div>
    <h1 class="h5 mt-3">Nova senha</h1>
    <p class="text-secondary">Escolha a senha que vai usar para entrar no sistema.</p>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:unless="${valido}" class="alert alert-danger">
      Este link nao e mais valido: ou passou das 2 horas, ou ja foi usado uma vez (RF18).
      Peca um novo link na tela de recuperacao.
    </div>

    <form method="post" th:action="@{/redefinir-senha}" th:if="${valido}">
      <input type="hidden" name="token" th:value="${token}">
      <div class="mb-3">
        <label class="form-label" for="senha">Nova senha</label>
        <input class="form-control" id="senha" name="senha" type="password" required autofocus>
        <div class="form-text">Minimo de 6 caracteres (RNF01).</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirmacao">Repita a nova senha</label>
        <input class="form-control" id="confirmacao" name="confirmacao" type="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
    </form>
    <div class="mt-3 text-center"><a th:href="@{/login}">Voltar para o login</a></div>
  </div>
</div>
</body>
</html>
