<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Entrar')}"></head>
<body class="tela-acesso">
<div class="container">
  <div class="caixa-acesso">
    <div class="marca">Agenda<span>Pro</span></div>
    <p class="text-secondary mb-4">Sistema de agendamento &middot; Equipe 1</p>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${aviso}" class="alert alert-success" th:text="${aviso}"></div>

    <form method="post" th:action="@{/login}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" id="email" name="email" type="email" required
               th:value="${email}" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" id="senha" name="senha" type="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <div class="mt-3 text-center">
      <a th:href="@{/recuperar-senha}">Esqueci minha senha</a>
    </div>
  </div>
  <p class="aviso-demo">
    Contas da carga de demonstracao &mdash; senha <b>123456</b> nas tres:<br>
    <b>admin@agendapro.com</b> (administrador) &middot;
    <b>ana@agendapro.com</b> (profissional) &middot;
    <b>marina@email.com</b> (cliente).
  </p>
  <footer class="text-center mt-4">
    AgendaPro &middot; Equipe 1 &middot; Fabrica de Software &middot; entrega final de 27/11/2026
  </footer>
</div>
</body>
</html>
