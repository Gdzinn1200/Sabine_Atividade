<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Agenda')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: topo}"></nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-3 mb-3">
    <form class="row g-2 align-items-end" th:action="@{/agenda}" method="get">
      <div class="col-md-3">
        <label class="form-label">Data</label>
        <input class="form-control" type="date" name="data" th:value="${data}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Profissional</label>
        <select class="form-select" name="profissional" th:unless="${travarProfissional}">
          <option value="">Todos</option>
          <option th:each="p : ${profissionais}" th:value="${p.id}"
                  th:selected="${profissional != null and profissional == p.id}"
                  th:text="${p.nome}">Nome</option>
        </select>
        <input class="form-control" type="text" th:if="${travarProfissional}" readonly
               th:value="${usuario.nome}">
        <div class="form-text" th:if="${travarProfissional}">
          Seu perfil mostra apenas a sua agenda.</div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Situacao</label>
        <select class="form-select" name="situacao">
          <option value="">Todas</option>
          <option th:each="s : ${situacoes}" th:value="${s}"
                  th:selected="${situacao != null and situacao == s}"
                  th:text="${s.rotulo}">Situacao</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary" type="submit">Filtrar</button>
        <a class="btn btn-outline-primary" th:href="@{/agenda}">Hoje</a>
      </div>
    </form>
  </div>

  <div class="card p-3">
    <div class="card-title">Agenda de <span th:text="${dataFormatada}">data</span></div>
    <div th:if="${#lists.isEmpty(agendamentos)}" class="vazio">
      <p>Nenhum atendimento encontrado para os filtros aplicados.</p>
      <a class="btn btn-primary" th:href="@{/agendamentos/novo}">Novo agendamento</a>
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(agendamentos)}">
      <table class="table align-middle">
        <thead><tr><th>Horario</th><th>Cliente</th><th>Servico</th><th>Profissional</th>
          <th>Valor</th><th>Situacao</th><th class="text-end">Acoes</th></tr></thead>
        <tbody>
        <tr th:each="a : ${agendamentos}">
          <td th:text="${a.horaInicioFormatada} + ' - ' + ${a.horaFimFormatada}">09:00</td>
          <td><b th:text="${a.cliente.nome}">Cliente</b></td>
          <td th:text="${a.servico.nome}">Servico</td>
          <td th:text="${a.profissional.nome}">Profissional</td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(a.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
          <td><span class="badge" th:classappend="'sit-' + ${a.situacao.name()}"
                    th:text="${a.situacao.rotulo}">Agendado</span></td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/agendamentos/{id}(id=${a.id})}">Abrir</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="mt-3">
      <a class="btn btn-primary" th:href="@{/agendamentos/novo}">Novo agendamento</a>
    </div>
  </div>

  <footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</div>
</body>
</html>
