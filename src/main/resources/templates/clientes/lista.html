<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabeca('Clientes')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: topo}"></nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-3 mb-3">
    <form class="row g-2 align-items-end" th:action="@{/clientes}" method="get">
      <div class="col-md-6">
        <label class="form-label">Buscar</label>
        <input class="form-control" type="text" name="termo" th:value="${termo}"
               placeholder="Nome, telefone ou e-mail">
      </div>
      <div class="col-md-3">
        <label class="form-label">Situacao</label>
        <select class="form-select" name="somenteAtivos">
          <option value="true" th:selected="${somenteAtivos}">Somente ativos</option>
          <option value="false" th:selected="${!somenteAtivos}">Todos</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <a class="btn btn-outline-primary" th:href="@{/clientes/novo}">Novo cliente</a>
      </div>
    </form>
  </div>

  <div class="card p-3">
    <div class="card-title">Clientes cadastrados (<span th:text="${#lists.size(clientes)}">0</span>)</div>
    <div th:if="${#lists.isEmpty(clientes)}" class="vazio">
      <p>Nenhum cliente encontrado.</p>
      <a class="btn btn-primary" th:href="@{/clientes/novo}">Cadastrar o primeiro cliente</a>
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(clientes)}">
      <table class="table align-middle">
        <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Situacao</th>
          <th class="text-end">Acoes</th></tr></thead>
        <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.nome}">Nome</td>
          <td th:text="${c.telefone}">Telefone</td>
          <td th:text="${c.email != null ? c.email : '-'}">E-mail</td>
          <td>
            <span class="badge badge-bloqueado" th:if="${c.bloqueado}">Bloqueado</span>
            <span class="badge badge-ativo" th:if="${c.ativo and !c.bloqueado}">Ativo</span>
            <span class="badge badge-inativo" th:unless="${c.ativo}">Inativo</span>
          </td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm"
               th:href="@{/clientes/{id}/historico(id=${c.id})}">Historico</a>
            <a class="btn btn-outline-primary btn-sm"
               th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
            <form th:if="${c.ativo}" class="d-inline" method="post"
                  th:action="@{/clientes/{id}/inativar(id=${c.id})}">
              <button class="btn btn-outline-primary btn-sm" type="submit">Inativar</button>
            </form>
            <form th:unless="${c.ativo}" class="d-inline" method="post"
                  th:action="@{/clientes/{id}/reativar(id=${c.id})}">
              <button class="btn btn-outline-primary btn-sm" type="submit">Reativar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</div>
</body>
</html>
