<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de cliente &middot; AgendaPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/agendapro.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-agendapro mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Agenda<span>Pro</span></a>
    <div class="navbar-nav flex-wrap">
      <a class="nav-link" th:href="@{/}">Inicio</a>
      <a class="nav-link" th:href="@{/agenda}">Agenda</a>
      <a class="nav-link" th:href="@{/agendamentos/novo}">Novo agendamento</a>
      <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
      <a class="nav-link" th:href="@{/profissionais}">Profissionais</a>
      <a class="nav-link" th:href="@{/servicos}">Servicos</a>
      <a class="nav-link" th:href="@{/horarios}">Horarios</a>
    </div>
  </div>
</nav>
<div class="container">
  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <div class="card p-4">
    <div class="card-title" th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Novo cliente</div>
    <form th:action="@{/clientes}" method="post" th:object="${cliente}">
      <input type="hidden" th:field="*{id}">
      <input type="hidden" th:field="*{ativo}">
      <input type="hidden" th:field="*{bloqueado}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nome completo <span class="obrigatorio">*</span></label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('nome')} ? 'is-invalid'"
                 type="text" th:field="*{nome}">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('nome')}"
               th:text="${erros['nome']}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Telefone <span class="obrigatorio">*</span></label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('telefone')} ? 'is-invalid'"
                 type="text" th:field="*{telefone}" placeholder="(00) 00000-0000">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('telefone')}"
               th:text="${erros['telefone']}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">E-mail</label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('email')} ? 'is-invalid'"
                 type="text" th:field="*{email}" placeholder="cliente@email.com">
          <div class="form-text">Usado para confirmacoes e lembretes nas proximas entregas.</div>
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('email')}"
               th:text="${erros['email']}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Data de nascimento</label>
          <input class="form-control" th:classappend="${erros != null and erros.containsKey('nascimento')} ? 'is-invalid'"
                 type="date" th:field="*{dataNascimento}">
          <div class="invalid-feedback d-block" th:if="${erros != null and erros.containsKey('nascimento')}"
               th:text="${erros['nascimento']}"></div>
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-primary" th:href="@{/clientes}">Voltar</a>
      </div>
    </form>
  </div>

  <footer class="mt-5 mb-4">
    AgendaPro &middot; Equipe 1 &middot; Fabrica de Software &middot; entrega de 06/11/2026
  </footer>
</div>
</body>
</html>
