<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgendaPro — protótipo funcional</title>
<style>
:root{
  --azul-escuro:#1F3864; --azul:#2E75B6; --fundo:#F5F7FA; --branco:#fff;
  --verde:#2E7D32; --verde-esc:#1F6F24; --ambar:#E8A33D; --vermelho:#C0392B; --vinho:#8C2E22;
  --texto:#333; --texto2:#6B7280; --borda:#E3E8F0; --borda2:#C9D2E0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Carlito,Roboto,'DejaVu Sans',Arial,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px}
img{max-width:100%}
a{color:var(--azul)}
/* ---------- estrutura ---------- */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:0 0 230px;background:var(--azul-escuro);color:#fff;padding:18px 0}
.logo{font-size:22px;font-weight:bold;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:14px}
.logo span{color:#8FB8E8}
.side a{display:block;color:#D7E1F2;text-decoration:none;padding:10px 20px;font-size:14.5px;border-left:3px solid transparent;cursor:pointer}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:bold;border-left:3px solid var(--ambar)}
.side .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#8FA6CC;padding:16px 20px 6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid #DDE3EC;padding:12px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:21px;color:var(--azul-escuro)}
.top .dir{font-size:13px;color:var(--texto2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .dir b{color:var(--texto)}
.menu-bt{display:none;background:none;border:1px solid var(--borda2);border-radius:6px;font-size:18px;padding:3px 9px;cursor:pointer;color:var(--azul-escuro)}
.body{padding:22px 26px;flex:1}
.card{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:18px;margin-bottom:18px}
.card h2{font-size:16px;color:#2E5496;margin-bottom:12px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:170px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:16px;flex:1;min-width:150px}
.kpi .n{font-size:27px;font-weight:bold;color:var(--azul-escuro)}
.kpi .l{font-size:13px;color:var(--texto2);margin-top:2px}
.tab-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#EEF2F9;color:var(--azul-escuro);text-align:left;padding:9px 10px;font-size:13px;border-bottom:1px solid #DDE3EC;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
.right{text-align:right}
.mut{color:#9AA3B0}
/* ---------- botões ---------- */
.bt{display:inline-block;padding:8px 14px;border-radius:6px;font-size:14px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.bt-p{background:var(--azul);color:#fff;font-weight:bold}
.bt-o{background:#fff;color:var(--azul);border-color:var(--azul)}
.bt-d{background:var(--vermelho);color:#fff;font-weight:bold}
.bt-s{padding:5px 10px;font-size:13px}
.bt:disabled,.bt[disabled]{opacity:.45;cursor:not-allowed}
/* ---------- etiquetas ---------- */
.bg{display:inline-block;padding:3px 9px;border-radius:11px;font-size:12px;font-weight:bold;color:#fff;white-space:nowrap}
.bg-AGENDADO{background:var(--ambar)}
.bg-CONFIRMADO{background:var(--verde)}
.bg-EM_ATENDIMENTO{background:var(--azul)}
.bg-CONCLUIDO{background:var(--verde-esc)}
.bg-CANCELADO{background:var(--vermelho)}
.bg-NAO_COMPARECEU{background:var(--vinho)}
.bg-ok{background:var(--verde)}.bg-off{background:#8C939E}.bg-bloq{background:var(--vermelho)}
/* ---------- formulários ---------- */
label{display:block;font-size:13px;color:#4A5568;margin-bottom:5px;font-weight:bold}
label i{color:var(--vermelho);font-style:normal}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--borda2);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;color:var(--texto)}
input:focus,select:focus,textarea:focus{outline:2px solid #BBD4EE;border-color:var(--azul)}
.fg{margin-bottom:14px}
.help{font-size:12px;color:var(--texto2);margin-top:4px}
.erro input,.erro select,.erro textarea{border-color:var(--vermelho);background:#FDF5F4}
.msg-err{font-size:12.5px;color:var(--vermelho);margin-top:4px;font-weight:bold}
/* ---------- horários ---------- */
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 12px;border:1px solid var(--borda2);border-radius:6px;background:#fff;font-size:14px;cursor:pointer}
.slot.sel{background:var(--azul);color:#fff;border-color:var(--azul);font-weight:bold}
.slot.off{background:#F0F1F3;color:#A0A6B0;text-decoration:line-through;cursor:not-allowed}
/* ---------- avisos ---------- */
.empty{text-align:center;padding:30px 18px;color:var(--texto2)}
.empty .ic{font-size:32px;color:var(--borda2)}
.empty p{margin:8px 0 14px;font-size:14px}
.aviso{padding:11px 14px;border-radius:6px;font-size:14px;margin-bottom:16px}
.a-ok{background:#E8F3E9;border:1px solid var(--verde);color:#1F5C22;font-weight:bold}
.a-at{background:#FCF3E3;border:1px solid var(--ambar);color:#7A5312}
.a-er{background:#FBEAE8;border:1px solid var(--vermelho);color:#8E2A1F;font-weight:bold}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{padding:11px 14px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 16px rgba(31,56,100,.18);background:#E8F3E9;border:1px solid var(--verde);color:#1F5C22}
.toast.er{background:#FBEAE8;border-color:var(--vermelho);color:#8E2A1F}
.toast.at{background:#FCF3E3;border-color:var(--ambar);color:#7A5312}
/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(31,56,100,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 14px;z-index:50;overflow:auto}
.modal{background:#fff;width:470px;max-width:100%;border-radius:10px;padding:22px;border-top:5px solid var(--azul)}
.modal.perigo{border-top-color:var(--vermelho)}
.modal h3{font-size:18px;color:var(--azul-escuro);margin-bottom:10px}
.modal p{font-size:14px;color:#4A5568;margin-bottom:14px;line-height:1.45}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
/* ---------- login ---------- */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--azul-escuro);padding:20px}
.login .box{background:#fff;width:400px;max-width:100%;border-radius:10px;padding:30px;text-align:center}
.login .lg{font-size:28px;font-weight:bold;color:var(--azul-escuro)}
.login .lg span{color:var(--azul)}
.login .sb{font-size:13.5px;color:var(--texto2);margin:4px 0 22px}
.login .fg{text-align:left}
.login .bt-p{width:100%;margin-top:6px}
.login .lk{display:inline-block;margin-top:14px;font-size:13px;color:var(--azul);cursor:pointer}
.contas{margin-top:20px;border-top:1px solid var(--borda);padding-top:14px;text-align:left}
.contas b{font-size:12.5px;color:#4A5568;display:block;margin-bottom:6px}
.contas button{display:block;width:100%;text-align:left;background:#F7F9FC;border:1px solid var(--borda);border-radius:6px;padding:7px 10px;font-size:12.5px;margin-bottom:6px;cursor:pointer;font-family:inherit;color:var(--texto)}
/* ---------- barras ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.bar .nm{width:150px;color:#4A5568}
.bar .tk{flex:1;background:#EEF2F9;height:16px;border-radius:8px;overflow:hidden;min-width:60px}
.bar .fl{height:16px;background:var(--azul)}
.bar .vl{width:40px;text-align:right;font-weight:bold;color:var(--azul-escuro)}
.reg{font-size:13px;color:#4A5568;line-height:1.5}
.reg code{background:#EEF2F9;padding:1px 5px;border-radius:4px;font-size:12px}
/* ---------- responsivo ---------- */
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.aberto{transform:translateX(0)}
  .menu-bt{display:block}
  .body{padding:16px 14px}
  .top{padding:10px 14px}
  .top h1{font-size:18px}
  .card{padding:14px}
}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>

<script>
/* =====================================================================
   AgendaPro — protótipo funcional
   Regras de negócio implementadas: RN01 a RN13 (ver tela "Regras aplicadas")
   Dados mantidos no navegador (localStorage), sem servidor.
   ===================================================================== */

var LIMITE_FUTUROS = 3;      // RN08
var ANTECEDENCIA_H = 4;      // RN05
var FALTAS_LIMITE = 3;       // RN10
var JANELA_FALTAS = 90;      // RN10 (dias)
var PASSO_GRADE = 20;        // minutos entre horários oferecidos
var CHAVE = 'agendapro_db_v2';

var SIT = ['AGENDADO','CONFIRMADO','EM_ATENDIMENTO','CONCLUIDO','CANCELADO','NAO_COMPARECEU'];
var SIT_NOME = {AGENDADO:'Agendado',CONFIRMADO:'Confirmado',EM_ATENDIMENTO:'Em atendimento',
                CONCLUIDO:'Concluído',CANCELADO:'Cancelado',NAO_COMPARECEU:'Não compareceu'};
var ATIVAS = ['AGENDADO','CONFIRMADO','EM_ATENDIMENTO'];
var FINAIS = ['CONCLUIDO','CANCELADO','NAO_COMPARECEU'];
var TRANSICAO = {  // RN09
  AGENDADO:['CONFIRMADO','EM_ATENDIMENTO','CANCELADO','NAO_COMPARECEU'],
  CONFIRMADO:['EM_ATENDIMENTO','CANCELADO','NAO_COMPARECEU'],
  EM_ATENDIMENTO:['CONCLUIDO'],
  CONCLUIDO:[], CANCELADO:[], NAO_COMPARECEU:[]
};
var DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

/* ------------------------------------------------------ utilidades */
function pad(n){return (n<10?'0':'')+n}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function maisDias(iso,n){var d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function brData(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function brDataHora(s){var p=s.split('T');return brData(p[0])+' '+p[1].substring(0,5)}
function minutos(hhmm){var p=hhmm.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10)}
function hhmm(min){return pad(Math.floor(min/60))+':'+pad(min%60)}
function ts(iso,hora){return new Date(iso+'T'+hora+':00').getTime()}
function agora(){return new Date().getTime()}
function diaSemana(iso){return new Date(iso+'T12:00').getDay()+1}  // 1=domingo
function dinheiro(v){return 'R$ '+Number(v).toFixed(2).replace('.',',')}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function porId(lista,id){for(var i=0;i<lista.length;i++){if(lista[i].id===id)return lista[i]}return null}

/* ------------------------------------------------------ dados */
var db=null, sessao=null, tela='painel', ctx={};

function semente(){
  var h=hojeISO();
  var d={seq:100,
    usuarios:[
      {id:1,nome:'Gabriel V. Hartmann',email:'admin@agendapro.com',senha:'123456',perfil:'ADMINISTRADOR',ativo:true,cadastro:h},
      {id:2,nome:'Ana Paula Ribeiro',email:'ana@agendapro.com',senha:'123456',perfil:'PROFISSIONAL',ativo:true,cadastro:h},
      {id:3,nome:'Jonas Ferreira',email:'jonas@agendapro.com',senha:'123456',perfil:'PROFISSIONAL',ativo:true,cadastro:h},
      {id:4,nome:'Marina Souza',email:'marina@email.com',senha:'123456',perfil:'CLIENTE',ativo:true,cadastro:h}
    ],
    clientes:[
      {id:1,idUsuario:4,nome:'Marina Souza',telefone:'(42) 99876-1122',email:'marina@email.com',nascimento:'1995-04-18',ativo:true,bloqueado:false},
      {id:2,idUsuario:null,nome:'Rafael Lima',telefone:'(42) 99712-3040',email:'rafael@email.com',nascimento:'1988-11-02',ativo:true,bloqueado:false},
      {id:3,idUsuario:null,nome:'Camila Reis',telefone:'(42) 99500-7711',email:'camila@email.com',nascimento:'1999-07-25',ativo:true,bloqueado:false},
      {id:4,idUsuario:null,nome:'Patrícia Nunes',telefone:'(42) 99655-8890',email:'patricia@email.com',nascimento:'1991-02-09',ativo:true,bloqueado:true}
    ],
    profissionais:[
      {id:1,idUsuario:2,nome:'Ana Paula Ribeiro',telefone:'(42) 99811-2020',email:'ana@agendapro.com',ativo:true,servicos:[1,3,5]},
      {id:2,idUsuario:3,nome:'Jonas Ferreira',telefone:'(42) 99733-4455',email:'jonas@agendapro.com',ativo:true,servicos:[2,4]}
    ],
    servicos:[
      {id:1,nome:'Corte feminino',descricao:'Corte com lavagem e finalização',duracao:40,preco:70,ativo:true},
      {id:2,nome:'Corte masculino',descricao:'Corte com máquina e tesoura',duracao:30,preco:45,ativo:true},
      {id:3,nome:'Coloração',descricao:'Coloração completa',duracao:90,preco:180,ativo:true},
      {id:4,nome:'Barba',descricao:'Barba com toalha quente',duracao:25,preco:35,ativo:true},
      {id:5,nome:'Hidratação',descricao:'Hidratação profunda',duracao:45,preco:90,ativo:true}
    ],
    horarios:[], bloqueios:[], agendamentos:[], historico:[], notificacoes:[]
  };
  var idh=1;
  for(var dia=2;dia<=6;dia++){
    d.horarios.push({id:idh++,idProfissional:1,dia:dia,inicio:'08:00',fim:'18:00'});
    d.horarios.push({id:idh++,idProfissional:2,dia:dia,inicio:'09:00',fim:'19:00'});
  }
  d.horarios.push({id:idh++,idProfissional:1,dia:7,inicio:'08:00',fim:'13:00'});
  d.bloqueios=[
    {id:1,idProfissional:1,data:h,inicio:'12:00',fim:'13:00',motivo:'Almoço'},
    {id:2,idProfissional:2,data:maisDias(h,7),inicio:'00:00',fim:'23:59',motivo:'Férias'}
  ];
  d.agendamentos=[
    {id:1,idCliente:1,idProfissional:1,idServico:1,data:h,inicio:'09:00',fim:'09:40',situacao:'CONFIRMADO',valor:70,obs:'',criado:h},
    {id:2,idCliente:2,idProfissional:2,idServico:4,data:h,inicio:'10:00',fim:'10:25',situacao:'AGENDADO',valor:35,obs:'',criado:h},
    {id:3,idCliente:3,idProfissional:1,idServico:3,data:h,inicio:'14:00',fim:'15:30',situacao:'AGENDADO',valor:180,obs:'',criado:h},
    {id:4,idCliente:1,idProfissional:1,idServico:1,data:maisDias(h,-28),inicio:'09:00',fim:'09:40',situacao:'CONCLUIDO',valor:70,obs:'',criado:maisDias(h,-30)},
    {id:5,idCliente:1,idProfissional:1,idServico:5,data:maisDias(h,-14),inicio:'10:30',fim:'11:15',situacao:'CONCLUIDO',valor:90,obs:'',criado:maisDias(h,-16)},
    {id:6,idCliente:4,idProfissional:1,idServico:5,data:maisDias(h,-10),inicio:'15:00',fim:'15:45',situacao:'NAO_COMPARECEU',valor:90,obs:'',criado:maisDias(h,-12)},
    {id:7,idCliente:4,idProfissional:1,idServico:1,data:maisDias(h,-20),inicio:'09:00',fim:'09:40',situacao:'NAO_COMPARECEU',valor:70,obs:'',criado:maisDias(h,-22)},
    {id:8,idCliente:4,idProfissional:2,idServico:2,data:maisDias(h,-40),inicio:'11:00',fim:'11:30',situacao:'NAO_COMPARECEU',valor:45,obs:'',criado:maisDias(h,-42)},
    {id:9,idCliente:2,idProfissional:2,idServico:2,data:maisDias(h,-7),inicio:'09:30',fim:'10:00',situacao:'CONCLUIDO',valor:45,obs:'',criado:maisDias(h,-9)},
    {id:10,idCliente:3,idProfissional:1,idServico:1,data:maisDias(h,-5),inicio:'16:00',fim:'16:40',situacao:'CANCELADO',valor:70,obs:'',criado:maisDias(h,-7)}
  ];
  d.seq=200;
  d.historico=[
    {id:1,idAgendamento:1,idUsuario:1,de:'AGENDADO',para:'CONFIRMADO',quando:h+'T08:10',motivo:'Confirmado por telefone'},
    {id:2,idAgendamento:6,idUsuario:1,de:'CONFIRMADO',para:'NAO_COMPARECEU',quando:maisDias(h,-10)+'T15:40',motivo:'Cliente não compareceu'}
  ];
  d.notificacoes=[
    {id:1,idAgendamento:1,tipo:'CONFIRMACAO',destino:'marina@email.com',quando:h+'T08:00',enviada:true},
    {id:2,idAgendamento:2,tipo:'CONFIRMACAO',destino:'rafael@email.com',quando:h+'T08:05',enviada:true}
  ];
  return d;
}
function novoId(){db.seq+=1;return db.seq}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(db))}catch(e){}}
function carregar(){
  try{var s=localStorage.getItem(CHAVE);if(s){db=JSON.parse(s);return}}catch(e){}
  db=semente();salvar();
}
function restaurar(){db=semente();salvar();fecharModal();aviso('Dados de demonstração restaurados.');render()}

/* ------------------------------------------------------ mensagens */
function aviso(txt,tipo){
  var cx=document.getElementById('toasts');
  var el=document.createElement('div');
  el.className='toast'+(tipo?' '+tipo:'');
  el.innerHTML=esc(txt);
  cx.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},4200);
}
function erro(txt){aviso(txt,'er')}
function atencao(txt){aviso(txt,'at')}
function modal(html,perigo){
  document.getElementById('modal').innerHTML=
    '<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal'+(perigo?' perigo':'')+'">'+html+'</div></div>';
}
function fecharModal(){document.getElementById('modal').innerHTML=''}

/* ------------------------------------------------------ permissões (RNF02) */
var MENU=[
  {grp:'Atendimento'},
  {t:'painel',r:'Painel',p:['ADMINISTRADOR','PROFISSIONAL','CLIENTE']},
  {t:'agenda',r:'Agenda',p:['ADMINISTRADOR','PROFISSIONAL']},
  {t:'novo',r:'Novo agendamento',p:['ADMINISTRADOR','PROFISSIONAL','CLIENTE']},
  {grp:'Cadastros'},
  {t:'clientes',r:'Clientes',p:['ADMINISTRADOR','PROFISSIONAL']},
  {t:'profissionais',r:'Profissionais',p:['ADMINISTRADOR']},
  {t:'servicos',r:'Serviços',p:['ADMINISTRADOR']},
  {t:'horarios',r:'Horários e bloqueios',p:['ADMINISTRADOR','PROFISSIONAL']},
  {grp:'Administração'},
  {t:'relatorios',r:'Relatórios',p:['ADMINISTRADOR']},
  {t:'usuarios',r:'Usuários',p:['ADMINISTRADOR']},
  {t:'notificacoes',r:'Notificações',p:['ADMINISTRADOR']},
  {t:'regras',r:'Regras aplicadas',p:['ADMINISTRADOR','PROFISSIONAL','CLIENTE']}
];
function pode(t){
  for(var i=0;i<MENU.length;i++){if(MENU[i].t===t)return MENU[i].p.indexOf(sessao.perfil)>=0}
  return true;
}
function ehAdmin(){return sessao.perfil==='ADMINISTRADOR'}
function meuProfissional(){
  for(var i=0;i<db.profissionais.length;i++){if(db.profissionais[i].idUsuario===sessao.id)return db.profissionais[i]}
  return null;
}
function meuCliente(){
  for(var i=0;i<db.clientes.length;i++){if(db.clientes[i].idUsuario===sessao.id)return db.clientes[i]}
  return null;
}
function vejoAgendamento(a){
  if(ehAdmin())return true;
  if(sessao.perfil==='PROFISSIONAL'){var p=meuProfissional();return p&&a.idProfissional===p.id}
  var c=meuCliente();return c&&a.idCliente===c.id;
}

/* ------------------------------------------------------ regras de negócio */
function conflito(idProfissional,data,ini,fim,idIgnorar){            // RN01
  var a=ts(data,ini), b=ts(data,fim);
  for(var i=0;i<db.agendamentos.length;i++){
    var g=db.agendamentos[i];
    if(g.id===idIgnorar) continue;
    if(g.idProfissional!==idProfissional||g.data!==data) continue;
    if(ATIVAS.indexOf(g.situacao)<0) continue;
    if(a < ts(g.data,g.fim) && ts(g.data,g.inicio) < b) return g;
  }
  return null;
}
function dentroDoHorario(idProfissional,data,ini,fim){                // RN02
  var d=diaSemana(data), mi=minutos(ini), mf=minutos(fim);
  for(var i=0;i<db.horarios.length;i++){
    var h=db.horarios[i];
    if(h.idProfissional===idProfissional&&h.dia===d&&minutos(h.inicio)<=mi&&mf<=minutos(h.fim))return true;
  }
  return false;
}
function bloqueado(idProfissional,data,ini,fim){                      // RN02
  var a=ts(data,ini), b=ts(data,fim);
  for(var i=0;i<db.bloqueios.length;i++){
    var q=db.bloqueios[i];
    if(q.idProfissional!==idProfissional||q.data!==data) continue;
    if(a < ts(q.data,q.fim) && ts(q.data,q.inicio) < b) return q;
  }
  return null;
}
function futurosAtivos(idCliente,idIgnorar){                          // RN08
  var n=0, ag=agora();
  for(var i=0;i<db.agendamentos.length;i++){
    var g=db.agendamentos[i];
    if(g.idCliente!==idCliente||g.id===idIgnorar) continue;
    if(['AGENDADO','CONFIRMADO'].indexOf(g.situacao)<0) continue;
    if(ts(g.data,g.inicio)>ag) n++;
  }
  return n;
}
function faltasRecentes(idCliente){                                   // RN10
  var n=0, limite=agora()-JANELA_FALTAS*86400000;
  for(var i=0;i<db.agendamentos.length;i++){
    var g=db.agendamentos[i];
    if(g.idCliente===idCliente&&g.situacao==='NAO_COMPARECEU'&&ts(g.data,g.inicio)>=limite) n++;
  }
  return n;
}
function podeCancelar(a){                                             // RN05 + RN09
  if(FINAIS.indexOf(a.situacao)>=0) return {ok:false,msg:'Este agendamento está em situação final ('+SIT_NOME[a.situacao]+') e não pode ser alterado (RN09).'};
  if(!ehAdmin()&&sessao.perfil==='CLIENTE'){
    var horas=(ts(a.data,a.inicio)-agora())/3600000;
    if(horas<ANTECEDENCIA_H) return {ok:false,msg:'Cancelamento pelo cliente exige '+ANTECEDENCIA_H+' horas de antecedência (RN05). Entre em contato com o estabelecimento.'};
  }
  return {ok:true};
}
function grade(idProfissional,data,duracao,idIgnorar){
  // devolve [{hora, fim, livre, motivo}] conforme RN01, RN02 e RN03
  var d=diaSemana(data), res=[], ag=agora();
  var faixas=db.horarios.filter(function(h){return h.idProfissional===idProfissional&&h.dia===d});
  faixas.sort(function(a,b){return minutos(a.inicio)-minutos(b.inicio)});
  for(var f=0;f<faixas.length;f++){
    var ini=minutos(faixas[f].inicio), fimF=minutos(faixas[f].fim);
    for(var m=ini;m+duracao<=fimF;m+=PASSO_GRADE){
      var hi=hhmm(m), hf=hhmm(m+duracao), motivo='';
      if(ts(data,hi)<=ag) motivo='Horário já passou (RN04)';
      var c=conflito(idProfissional,data,hi,hf,idIgnorar);
      if(!motivo&&c) motivo='Ocupado (RN01)';
      var b=bloqueado(idProfissional,data,hi,hf);
      if(!motivo&&b) motivo='Bloqueio: '+(b.motivo||'período indisponível')+' (RN02)';
      res.push({hora:hi,fim:hf,livre:!motivo,motivo:motivo});
    }
  }
  return res;
}
function registrarHistorico(idAgendamento,de,para,motivo){            // RNF10
  db.historico.push({id:novoId(),idAgendamento:idAgendamento,idUsuario:sessao.id,de:de,para:para,
    quando:hojeISO()+'T'+hhmm(new Date().getHours()*60+new Date().getMinutes()),motivo:motivo||''});
}
function notificar(idAgendamento,tipo){                               // RF14 / RF15
  var a=porId(db.agendamentos,idAgendamento);
  var c=a?porId(db.clientes,a.idCliente):null;
  if(!c||!c.email) return;
  db.notificacoes.push({id:novoId(),idAgendamento:idAgendamento,tipo:tipo,destino:c.email,
    quando:hojeISO()+'T'+hhmm(new Date().getHours()*60+new Date().getMinutes()),enviada:true});
}
function aplicarBloqueioPorFaltas(idCliente){                         // RN10
  var c=porId(db.clientes,idCliente);
  if(c&&!c.bloqueado&&faltasRecentes(idCliente)>=FALTAS_LIMITE){
    c.bloqueado=true;
    atencao('Cliente '+c.nome+' bloqueado para agendamento próprio: '+FALTAS_LIMITE+' faltas em '+JANELA_FALTAS+' dias (RN10).');
  }
}

        '<button class="bt bt-o bt-s" onclick="liberarCliente('+c.id+')">Liberar</button></div>';

function mudar(campo,valor){
  if(campo==='idCliente'||campo==='idServico'||campo==='idProfissional') valor=parseInt(valor,10);
  if(campo==='idServico'||campo==='idProfissional'||campo==='data') ctx.hora='';
  ctx[campo]=valor; ctx.erroData=''; 
  var o=document.getElementById('n_obs'); if(o) ctx.obs=o.value;
  render();
}
function salvarAgendamento(idEdit){
  var o=document.getElementById('n_obs'); if(o) ctx.obs=o.value;
  var cli=porId(db.clientes,ctx.idCliente), serv=porId(db.servicos,ctx.idServico), prof=porId(db.profissionais,ctx.idProfissional);
  if(!cli||!serv||!prof){erro('Selecione cliente, serviço e profissional.');return}
  if(!ctx.hora){erro('Selecione um horário disponível.');return}
  var ini=ctx.hora, fim=hhmm(minutos(ctx.hora)+serv.duracao);          // RN03
  if(ts(ctx.data,ini)<=agora()){                                        // RN04
    ctx.erroData='Não é possível agendar em data ou hora anterior à atual (RN04).'; render(); erro(ctx.erroData); return;
  }
  if(prof.servicos.indexOf(serv.id)<0){erro('O profissional não executa este serviço (RN06).');return}   // RN06
  if(!dentroDoHorario(prof.id,ctx.data,ini,fim)){erro('Horário fora da faixa de atendimento do profissional (RN02).');return}
  var b=bloqueado(prof.id,ctx.data,ini,fim);
  if(b){erro('Período bloqueado: '+(b.motivo||'indisponível')+' (RN02).');return}
  var c=conflito(prof.id,ctx.data,ini,fim,idEdit||null);
  if(c){erro('Conflito de horário com o agendamento #'+c.id+' ('+c.inicio+'–'+c.fim+') (RN01).');return}
  if(cli.bloqueado&&sessao.perfil==='CLIENTE'){erro('Cliente bloqueado por faltas (RN10). Procure o estabelecimento.');return}
  if(futurosAtivos(cli.id,idEdit||null)>=LIMITE_FUTUROS){              // RN08
    erro('Limite de '+LIMITE_FUTUROS+' agendamentos futuros ativos por cliente atingido (RN08).');return;
  }
  if(idEdit){
    var a=porId(db.agendamentos,idEdit);
    var antes=brData(a.data)+' '+a.inicio;
    a.idCliente=cli.id;a.idProfissional=prof.id;a.idServico=serv.id;a.data=ctx.data;a.inicio=ini;a.fim=fim;a.valor=serv.preco;a.obs=ctx.obs;
    registrarHistorico(a.id,a.situacao,a.situacao,'Remarcado de '+antes+' para '+brData(ctx.data)+' '+ini);
    notificar(a.id,'CONFIRMACAO'); salvar();
    aviso('Agendamento remarcado para '+brData(ctx.data)+' às '+ini+'. E-mail enviado ao cliente.');
    ctx={}; ir('detalhe',{id:a.id}); return;
  }
  var novo={id:novoId(),idCliente:cli.id,idProfissional:prof.id,idServico:serv.id,data:ctx.data,
            inicio:ini,fim:fim,situacao:'AGENDADO',valor:serv.preco,obs:ctx.obs,criado:hojeISO()};
  db.agendamentos.push(novo);
  registrarHistorico(novo.id,null,'AGENDADO','Agendamento criado');
  notificar(novo.id,'CONFIRMACAO');
  salvar();
  aviso('Agendamento de '+cli.nome+' gravado para '+brData(ctx.data)+' às '+ini+'. Confirmação enviada por e-mail (RF14).');
  ctx={}; ir('detalhe',{id:novo.id});
}

/* -------------------------------------------------- detalhe */
function vDetalhe(){
  var a=porId(db.agendamentos,ctx.id);
  if(!a) return '<div class="card"><div class="empty"><p>Agendamento não encontrado.</p>'+
    '<button class="bt bt-p" onclick="ir(\'agenda\')">Voltar para a agenda</button></div></div>';
  if(!vejoAgendamento(a)) return '<div class="card"><div class="aviso a-er">Você não tem acesso a este agendamento (RNF02).</div></div>';
  var c=porId(db.clientes,a.idCliente), s=porId(db.servicos,a.idServico), p=porId(db.profissionais,a.idProfissional);
  var h='<div class="card"><h2>Agendamento #'+a.id+' '+etiqueta(a.situacao)+'</h2><div class="row">'+
    info('Cliente',c?c.nome:'—')+info('Serviço',(s?s.nome:'—')+' ('+(s?s.duracao:0)+' min)')+
    info('Profissional',p?p.nome:'—')+info('Data e horário',brData(a.data)+' — '+a.inicio+' às '+a.fim)+
    info('Valor',dinheiro(a.valor))+'</div>';
  if(a.obs) h+='<div class="help" style="margin-top:10px"><b>Observação:</b> '+esc(a.obs)+'</div>';
  h+='</div>';

  h+='<div class="card"><h2>Ações disponíveis</h2>';
  var prox=TRANSICAO[a.situacao];
  if(!prox.length){
    h+='<div class="aviso a-at">Situação final: este agendamento não pode mais ser alterado (RN09).</div>';
  }else{
    var bts=[];
    if(prox.indexOf('CONFIRMADO')>=0&&sessao.perfil!=='CLIENTE') bts.push(btSit(a.id,'CONFIRMADO','Confirmar','bt-p'));
    if(prox.indexOf('EM_ATENDIMENTO')>=0&&sessao.perfil!=='CLIENTE') bts.push(btSit(a.id,'EM_ATENDIMENTO','Iniciar atendimento','bt-p'));
    if(prox.indexOf('CONCLUIDO')>=0&&sessao.perfil!=='CLIENTE') bts.push(btSit(a.id,'CONCLUIDO','Concluir atendimento','bt-p'));
    if(prox.indexOf('NAO_COMPARECEU')>=0&&sessao.perfil!=='CLIENTE') bts.push(btSit(a.id,'NAO_COMPARECEU','Registrar falta','bt-o'));
    bts.push('<button class="bt bt-o" onclick="remarcar('+a.id+')">Remarcar</button>');
    bts.push('<button class="bt bt-d" onclick="pedirCancelamento('+a.id+')">Cancelar agendamento</button>');
    h+='<div class="acts" style="justify-content:flex-start">'+bts.join(' ')+'</div>';
    if(sessao.perfil==='CLIENTE'){
      var horas=(ts(a.data,a.inicio)-agora())/3600000;
      h+='<div class="help" style="margin-top:10px">Faltam '+horas.toFixed(1)+' horas para o atendimento. '+
        'O cancelamento pelo cliente exige '+ANTECEDENCIA_H+' horas de antecedência (RN05).</div>';
    }
  }
  h+='</div>';

  var hist=db.historico.filter(function(x){return x.idAgendamento===a.id});
  h+='<div class="card"><h2>Histórico de situação (RNF10)</h2>';
  h+= hist.length? '<div class="tab-wrap"><table><tr><th>Quando</th><th>De</th><th>Para</th><th>Usuário</th><th>Motivo</th></tr>'+
      hist.map(function(x){
        var u=porId(db.usuarios,x.idUsuario);
        return '<tr><td>'+brDataHora(x.quando)+'</td><td>'+(x.de?SIT_NOME[x.de]:'—')+'</td><td>'+SIT_NOME[x.para]+
          '</td><td>'+esc(u?u.nome:'—')+'</td><td>'+esc(x.motivo||'—')+'</td></tr>'}).join('')+'</table></div>'
    : '<div class="empty"><p>Nenhuma alteração registrada ainda.</p></div>';
  h+='</div>';

  var nots=db.notificacoes.filter(function(x){return x.idAgendamento===a.id});
  if(nots.length){
    h+='<div class="card"><h2>Mensagens enviadas ao cliente</h2><div class="tab-wrap"><table><tr><th>Tipo</th><th>Destinatário</th><th>Envio</th></tr>'+
      nots.map(function(x){return '<tr><td>'+x.tipo+'</td><td>'+esc(x.destino)+'</td><td>'+brDataHora(x.quando)+'</td></tr>'}).join('')+
      '</table></div></div>';
  }
  h+='<button class="bt bt-o" onclick="ir(\''+(sessao.perfil==='CLIENTE'?'painel':'agenda')+'\',{data:\''+a.data+'\'})">Voltar</button>';
  return h;
}
function info(rot,v){return '<div class="col"><div class="help">'+rot+'</div><b>'+esc(v)+'</b></div>'}
function btSit(id,sit,rot,cls){return '<button class="bt '+cls+'" onclick="mudarSituacao('+id+',\''+sit+'\')">'+rot+'</button>'}

function mudarSituacao(id,nova){
  var a=porId(db.agendamentos,id);
  if(TRANSICAO[a.situacao].indexOf(nova)<0){erro('Transição não permitida a partir de '+SIT_NOME[a.situacao]+' (RN09).');return}
  if(nova==='NAO_COMPARECEU'){
    modal('<h3>Registrar falta</h3><p>Confirma que o cliente não compareceu ao atendimento? '+
      'A ocorrência conta para o bloqueio automático após '+FALTAS_LIMITE+' faltas em '+JANELA_FALTAS+' dias (RN10).</p>'+
      '<div class="acts"><button class="bt bt-o" onclick="fecharModal()">Voltar</button>'+
      '<button class="bt bt-d" onclick="confirmarSituacao('+id+',\'NAO_COMPARECEU\',\'Cliente não compareceu\')">Registrar falta</button></div>',true);
    return;
  }
  confirmarSituacao(id,nova,'');
}
function confirmarSituacao(id,nova,motivo){
  var a=porId(db.agendamentos,id), de=a.situacao;
  a.situacao=nova; registrarHistorico(id,de,nova,motivo);
  if(nova==='NAO_COMPARECEU') aplicarBloqueioPorFaltas(a.idCliente);
  salvar(); fecharModal(); aviso('Situação atualizada para '+SIT_NOME[nova]+'.'); render();
}
function remarcar(id){
  var a=porId(db.agendamentos,id), r=podeCancelar(a);
  if(!r.ok){erro(r.msg);return}
  ctx={}; ir('novo',{id:id});
}
function pedirCancelamento(id){
  var a=porId(db.agendamentos,id), r=podeCancelar(a);

    '<option value="Solicitação do cliente">Solicitação do cliente</option>'+
    '<option value="Indisponibilidade do profissional">Indisponibilidade do profissional</option>'+
    '<option value="Outro">Outro</option></select></div>'+
    '<p style="font-size:13px;color:#7A5312;background:#FCF3E3;border:1px solid var(--ambar);padding:9px;border-radius:6px">'+
    'O horário voltará a ficar disponível na agenda e o cliente receberá um e-mail de aviso. A operação ficará registrada no histórico.</p>'+
    '<div class="acts"><button class="bt bt-o" onclick="fecharModal()">Voltar</button>'+
    '<button class="bt bt-d" onclick="confirmarCancelamento('+id+')">Confirmar cancelamento</button></div>',true);
}
function confirmarCancelamento(id){
  var a=porId(db.agendamentos,id), motivo=val('mc_motivo')||'Não informado', de=a.situacao;
  a.situacao='CANCELADO'; registrarHistorico(id,de,'CANCELADO',motivo); notificar(id,'CANCELAMENTO');
  salvar(); fecharModal(); aviso('Agendamento cancelado. Horário liberado e aviso enviado ao cliente.'); render();
}

function limparErros(ids){ids.forEach(function(i){
  var g=document.getElementById('g_'+i), e=document.getElementById('e_'+i);
  if(g)g.classList.remove('erro'); if(e)e.innerHTML='';})}
function marcaErro(campo,msg){
  var g=document.getElementById('g_'+campo), e=document.getElementById('e_'+campo);
  if(g)g.classList.add('erro'); if(e)e.innerHTML=esc(msg);
}
function salvarCliente(id){
  limparErros(['nome','tel','email']);
  var nome=val('f_nome'), tel=val('f_tel'), em=val('f_email').toLowerCase(), nasc=val('f_nasc'), ok=true;
  if(nome.length<3){marcaErro('nome','Informe o nome completo do cliente.');ok=false}
  if(tel.length<8){marcaErro('tel','Informe um telefone válido com DDD.');ok=false}
  if(em){
    if(em.indexOf('@')<1||em.indexOf('.')<0){marcaErro('email','Informe um e-mail válido.');ok=false}
    for(var i=0;i<db.clientes.length;i++){                                  // RN07
      var c=db.clientes[i];
      if(c.id!==id&&c.ativo&&(c.email||'').toLowerCase()===em){marcaErro('email','Já existe um cliente ativo com este e-mail (RN07).');ok=false}
    }
  }
  for(var j=0;j<db.clientes.length;j++){                                    // RN07
    var c2=db.clientes[j];
    if(c2.id!==id&&c2.ativo&&c2.telefone===tel){marcaErro('tel','Já existe um cliente ativo com este telefone (RN07).');ok=false}
  }
  if(!ok){erro('Corrija os campos destacados.');return}
  if(id){
    var c3=porId(db.clientes,id);
    c3.nome=nome;c3.telefone=tel;c3.email=em;c3.nascimento=nasc;
    aviso('Cliente atualizado.');
  }else{
    db.clientes.push({id:novoId(),idUsuario:null,nome:nome,telefone:tel,email:em,nascimento:nasc,ativo:true,bloqueado:false});
    aviso('Cliente cadastrado com sucesso.');
  }
  salvar(); ir('clientes',{});
}

    h+='<div class="empty"><div class="ic">&#128683;</div><p>Nenhum bloqueio registrado.</p></div>';
  }else{
    h+='<div class="tab-wrap"><table><tr><th>Data</th><th>Período</th><th>Motivo</th><th class="right">Ações</th></tr>';
    bls.forEach(function(b){
      h+='<tr><td>'+brData(b.data)+'</td><td>'+b.inicio+' — '+b.fim+'</td><td>'+esc(b.motivo||'—')+'</td>'+
        '<td class="right"><button class="bt bt-o bt-s" onclick="removerBloqueio('+b.id+')">Remover</button></td></tr>';

}
function adicionarFaixa(){
  limparErros(['fx']);
  var dia=parseInt(val('fx_dia'),10), ini=val('fx_ini'), fim=val('fx_fim');
  if(minutos(fim)<=minutos(ini)){marcaErro('fx','A hora final deve ser posterior à inicial.');erro('Faixa inválida.');return}
  var ex=db.horarios.filter(function(h){return h.idProfissional===ctx.prof&&h.dia===dia});
  for(var i=0;i<ex.length;i++){
    if(minutos(ini)<minutos(ex[i].fim)&&minutos(ex[i].inicio)<minutos(fim)){
      marcaErro('fx','A faixa se sobrepõe a outra já cadastrada ('+ex[i].inicio+'–'+ex[i].fim+').');erro('Faixa sobreposta.');return;
    }
  }
  db.horarios.push({id:novoId(),idProfissional:ctx.prof,dia:dia,inicio:ini,fim:fim});
  salvar();aviso('Faixa de atendimento adicionada.');render();
}
function removerFaixa(id){
  var f=porId(db.horarios,id);
  var futuros=db.agendamentos.filter(function(a){
    return a.idProfissional===f.idProfissional&&ATIVAS.indexOf(a.situacao)>=0&&
      ts(a.data,a.inicio)>agora()&&diaSemana(a.data)===f.dia;
  });
  var txt = futuros.length? 'Existem '+futuros.length+' agendamento(s) futuro(s) em '+DIAS[f.dia-1]+
    '. Eles continuam válidos, mas o dia deixará de oferecer novos horários.' : 'A faixa deixará de oferecer horários para novos agendamentos.';
  modal('<h3>Remover faixa de horário?</h3><p>'+DIAS[f.dia-1]+', '+f.inicio+' às '+f.fim+'.<br>'+txt+'</p>'+
    '<div class="acts"><button class="bt bt-o" onclick="fecharModal()">Voltar</button>'+
    '<button class="bt bt-d" onclick="confirmarRemoverFaixa('+id+')">Remover</button></div>',true);
}
function confirmarRemoverFaixa(id){
  db.horarios=db.horarios.filter(function(h){return h.id!==id});
  salvar();fecharModal();aviso('Faixa removida.');render();
}
function adicionarBloqueio(){
  limparErros(['bl']);
  var data=val('bl_data'), ini=val('bl_ini'), fim=val('bl_fim');
  if(!data){marcaErro('bl','Informe a data do bloqueio.');return}
  if(minutos(fim)<=minutos(ini)){marcaErro('bl','A hora final deve ser posterior à inicial.');erro('Período inválido.');return}
  var atingidos=db.agendamentos.filter(function(a){
    return a.idProfissional===ctx.prof&&a.data===data&&ATIVAS.indexOf(a.situacao)>=0&&
      ts(data,ini)<ts(a.data,a.fim)&&ts(a.data,a.inicio)<ts(data,fim);
  });
  if(atingidos.length){
    atencao('Existem '+atingidos.length+' agendamento(s) ativo(s) nesse período. Remarque ou cancele antes de bloquear.');
    return;
  }
  db.bloqueios.push({id:novoId(),idProfissional:ctx.prof,data:data,inicio:ini,fim:fim,motivo:val('bl_motivo')});
  salvar();aviso('Bloqueio registrado. Os horários deixam de ser oferecidos (RN02).');render();
}
function removerBloqueio(id){
  db.bloqueios=db.bloqueios.filter(function(b){return b.id!==id});
  salvar();aviso('Bloqueio removido.');render();
}

function vRelatorios(){
  if(!ctx.de) ctx.de=maisDias(hojeISO(),-30);
  if(!ctx.ate) ctx.ate=hojeISO();
  if(ctx.rprof===undefined) ctx.rprof=0;
  var h='<div class="card"><h2>Filtros do relatório</h2><div class="row">'+
    '<div class="col"><label>De <i>*</i></label><input type="date" id="r_de" value="'+ctx.de+'"></div>'+
    '<div class="col"><label>Até <i>*</i></label><input type="date" id="r_ate" value="'+ctx.ate+'"></div>'+
    '<div class="col"><label>Profissional</label><select id="r_prof"><option value="0">Todos</option>'+opcoesProf(ctx.rprof)+'</select></div>'+
    '<div class="col" style="flex:0 0 130px;padding-top:23px"><button class="bt bt-p" onclick="gerarRelatorio()">Gerar</button></div>'+
    '</div>'+(ctx.erroRel?'<div class="msg-err">'+esc(ctx.erroRel)+'</div>':'')+'</div>';
  var lista=db.agendamentos.filter(function(a){
    if(a.data<ctx.de||a.data>ctx.ate) return false;
    if(ctx.rprof&&a.idProfissional!==ctx.rprof) return false;
    return true;
  });
  if(!lista.length) return h+'<div class="card"><div class="empty"><div class="ic">&#128202;</div>'+
    '<p>Nenhum registro encontrado para os filtros aplicados.</p></div></div>';
  var conc=lista.filter(function(a){return a.situacao==='CONCLUIDO'});
  var canc=lista.filter(function(a){return a.situacao==='CANCELADO'});
  var falt=lista.filter(function(a){return a.situacao==='NAO_COMPARECEU'});
  var total=0; conc.forEach(function(a){total+=a.valor});
  h+='<div class="row" style="margin-bottom:18px">'+kpi(conc.length,'Concluídos')+kpi(canc.length,'Cancelados')+
     kpi(falt.length,'Faltas')+kpi(dinheiro(total),'Total concluído')+'</div>';
  // serviços
  var porServ={};
  lista.forEach(function(a){if(a.situacao==='CONCLUIDO'||ATIVAS.indexOf(a.situacao)>=0){porServ[a.idServico]=(porServ[a.idServico]||0)+1}});
  var arr=Object.keys(porServ).map(function(k){return {id:parseInt(k,10),n:porServ[k]}}).sort(function(a,b){return b.n-a.n});
  var maxN=arr.length?arr[0].n:1;
  h+='<div class="card"><h2>Serviços mais procurados</h2>';
  arr.forEach(function(x){
    var s=porId(db.servicos,x.id);
    h+='<div class="bar"><span class="nm">'+esc(s?s.nome:'—')+'</span><span class="tk">'+
      '<span class="fl" style="width:'+Math.round(x.n/maxN*100)+'%"></span></span><span class="vl">'+x.n+'</span></div>';
  });
  h+='</div>';
  // profissionais
  h+='<div class="card"><h2>Atendimentos por profissional</h2><div class="tab-wrap">'+
    '<table><tr><th>Profissional</th><th>Concluídos</th><th>Cancelados</th><th>Faltas</th><th>Total (R$)</th></tr>';
  db.profissionais.forEach(function(p){
    var meus=lista.filter(function(a){return a.idProfissional===p.id});
    if(!meus.length) return;
    var c=meus.filter(function(a){return a.situacao==='CONCLUIDO'});
    var t=0; c.forEach(function(a){t+=a.valor});
    h+='<tr><td><b>'+esc(p.nome)+'</b></td><td>'+c.length+'</td>'+
      '<td>'+meus.filter(function(a){return a.situacao==='CANCELADO'}).length+'</td>'+
      '<td>'+meus.filter(function(a){return a.situacao==='NAO_COMPARECEU'}).length+'</td>'+
      '<td>'+dinheiro(t)+'</td></tr>';
  });
  h+='</table></div></div>';
  h+='<div class="help">Período de '+brData(ctx.de)+' a '+brData(ctx.ate)+'. Acesso restrito ao perfil Administrador (RN13).</div>';
  return h;
}
function gerarRelatorio(){
  var de=val('r_de'), ate=val('r_ate');
  if(!de||!ate){erro('Informe o período.');return}
  if(de>ate){ir('relatorios',{de:de,ate:ate,rprof:parseInt(val('r_prof'),10)||0,erroRel:'A data inicial não pode ser posterior à final.'});return}
  ir('relatorios',{de:de,ate:ate,rprof:parseInt(val('r_prof'),10)||0});
}

    '<button class="bt bt-p" onclick="salvarUsuario()">Criar conta</button></div>';
  h+='<div class="card"><h2>Permissões por perfil (RNF02)</h2><div class="tab-wrap"><table>'+
    '<tr><th>Função</th><th>Administrador</th><th>Profissional</th><th>Cliente</th></tr>'+
    linhaPerm('Cadastros de clientes, serviços e profissionais','Sim','Consulta','Não')+
    linhaPerm('Agenda','Completa','Própria agenda','Próprios agendamentos')+
    linhaPerm('Cancelar com menos de '+ANTECEDENCIA_H+'h (RN05)','Sim','Sim','Não')+
    linhaPerm('Relatórios gerenciais (RN13)','Sim','Não','Não')+
    linhaPerm('Usuários e permissões','Sim','Não','Não')+
    '</table></div></div>';
  return h;
}
function linhaPerm(a,b,c,d){return '<tr><td>'+a+'</td><td>'+b+'</td><td>'+c+'</td><td>'+d+'</td></tr>'}
function salvarUsuario(){
  limparErros(['unome','uemail','usenha']);
  var nome=val('f_unome'), em=val('f_uemail').toLowerCase(), se=val('f_usenha'), ok=true;
  if(nome.length<3){marcaErro('unome','Informe o nome do usuário.');ok=false}
  if(em.indexOf('@')<1||em.indexOf('.')<0){marcaErro('uemail','Informe um e-mail válido.');ok=false}
  for(var i=0;i<db.usuarios.length;i++){                               // RN07
    if(db.usuarios[i].email.toLowerCase()===em){marcaErro('uemail','Já existe uma conta com este e-mail (RN07).');ok=false}
  }
  if(se.length<6){marcaErro('usenha','A senha deve ter ao menos 6 caracteres.');ok=false}
  if(!ok){erro('Corrija os campos destacados.');return}
  db.usuarios.push({id:novoId(),nome:nome,email:em,senha:se,perfil:val('f_uperfil'),ativo:true,cadastro:hojeISO()});
  salvar();aviso('Conta criada. O usuário já pode acessar o sistema.');render();
}
function inativarUsuario(id){porId(db.usuarios,id).ativo=false;salvar();aviso('Conta inativada. O acesso foi bloqueado.');render()}
function reativarUsuario(id){porId(db.usuarios,id).ativo=true;salvar();aviso('Conta reativada.');render()}

/* -------------------------------------------------- notificações */
function vNotificacoes(){
  var lista=db.notificacoes.slice().sort(function(a,b){return a.quando<b.quando?1:-1});
  var h='<div class="card"><h2>Mensagens enviadas (RF14 e RF15)</h2>'+
    '<div class="aviso a-at">Nesta versão de protótipo o envio é simulado: o sistema registra a mensagem que seria enviada por e-mail.</div>';
  if(!lista.length){
    h+='<div class="empty"><div class="ic">&#9993;</div><p>Nenhuma mensagem registrada.</p></div>';
  }else{
    h+='<div class="tab-wrap"><table><tr><th>Quando</th><th>Tipo</th><th>Destinatário</th><th>Agendamento</th><th>Situação do envio</th></tr>';
    lista.forEach(function(n){
      var a=porId(db.agendamentos,n.idAgendamento);
      h+='<tr><td>'+brDataHora(n.quando)+'</td><td>'+n.tipo+'</td><td>'+esc(n.destino)+'</td>'+
        '<td>'+(a?'#'+a.id+' — '+brData(a.data)+' '+a.inicio:'—')+'</td>'+
        '<td>'+(n.enviada?'<span class="bg bg-ok">Enviada</span>':'<span class="bg bg-off">Pendente</span>')+'</td></tr>';
    });
    h+='</table></div>';
  }
  h+='<div style="margin-top:14px"><button class="bt bt-o" onclick="gerarLembretes()">Executar rotina de lembretes (RF15)</button>'+
     '<div class="help">Simula a rotina automática que envia lembretes 24 horas antes do atendimento, uma única vez por agendamento (RN11).</div></div>';
  return h+'</div>';
}
function gerarLembretes(){
  var alvo=maisDias(hojeISO(),1), n=0;
  db.agendamentos.forEach(function(a){
    if(a.data!==alvo) return;
    if(['AGENDADO','CONFIRMADO'].indexOf(a.situacao)<0) return;        // RN11
    var jaTem=db.notificacoes.some(function(x){return x.idAgendamento===a.id&&x.tipo==='LEMBRETE'});
    if(jaTem) return;                                                  // RN11
    notificar(a.id,'LEMBRETE'); n++;
  });
  salvar();
  if(n) aviso(n+' lembrete(s) enviado(s) para os atendimentos de '+brData(alvo)+'.');
  else atencao('Nenhum lembrete a enviar: não há atendimentos ativos em '+brData(alvo)+' sem lembrete registrado.');
  render();
}

/* -------------------------------------------------- regras */
function vRegras(){
  var regras=[
    ['RN01','Conflito de horários','Agenda e novo agendamento: horários que se sobrepõem aparecem riscados e a gravação é bloqueada.'],
    ['RN02','Disponibilidade do profissional','Só aparecem horários dentro das faixas cadastradas e fora dos bloqueios.'],
    ['RN03','Cálculo do término','O término é calculado pela duração do serviço e não pode ser digitado.'],
    ['RN04','Agendamento retroativo','Datas e horas passadas são recusadas e os horários do passado aparecem riscados.'],
    ['RN05','Antecedência para cancelamento','Cliente só cancela com '+ANTECEDENCIA_H+'h de antecedência; administrador e profissional cancelam a qualquer momento.'],
    ['RN06','Habilitação do profissional','A lista de profissionais mostra apenas quem executa o serviço escolhido.'],
    ['RN07','Unicidade do cadastro','E-mail e telefone de cliente e e-mail de usuário não podem repetir.'],
    ['RN08','Limite de agendamentos futuros','Máximo de '+LIMITE_FUTUROS+' agendamentos futuros ativos por cliente.'],
    ['RN09','Fluxo da situação','As ações disponíveis mudam conforme a situação; Concluído, Cancelado e Não compareceu são finais.'],
    ['RN10','Controle de faltas','Após '+FALTAS_LIMITE+' faltas em '+JANELA_FALTAS+' dias o cliente é bloqueado; só o administrador libera.'],
    ['RN11','Envio de lembrete','A rotina de lembretes envia uma única mensagem por agendamento, 24h antes.'],
    ['RN12','Preservação do histórico','Cadastros são inativados, nunca excluídos.'],
    ['RN13','Acesso aos relatórios','Relatórios e valores totais só para o perfil Administrador.']
  ];
  var h='<div class="card"><h2>Regras de negócio aplicadas neste protótipo</h2>'+
    '<div class="aviso a-at">Este protótipo é funcional e mantém os dados no próprio navegador. '+
    'Use o botão <b>Restaurar demonstração</b> no topo para voltar aos dados iniciais.</div>'+
    '<div class="tab-wrap"><table><tr><th>Regra</th><th>Nome</th><th>Onde testar</th></tr>';
  regras.forEach(function(r){h+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'});
  h+='</table></div></div>';
  h+='<div class="card"><h2>Requisitos não funcionais demonstrados</h2><div class="reg">'+
    '<p><b>RNF02</b> — o menu e as ações mudam conforme o perfil autenticado; tentativas de acesso indevido são recusadas.</p>'+
    '<p><b>RNF05</b> — mensagens de validação em português, abaixo do campo com problema.</p>'+
    '<p><b>RNF06</b> — layout responsivo: em telas estreitas o menu recolhe e as tabelas rolam horizontalmente.</p>'+
    '<p><b>RNF10</b> — toda mudança de situação grava histórico com data, hora e usuário responsável.</p>'+
    '<p><b>RNF01</b> — nesta simulação a senha fica em memória; na implementação será gravada com hash (bcrypt).</p>'+
    '</div></div>';
  return h;
}

/* ------------------------------------------------------ render */
var TITULOS={painel:'Painel inicial',agenda:'Agenda',novo:'Novo agendamento',detalhe:'Detalhe do agendamento',
  clientes:'Clientes',cliente_form:'Cadastro de cliente',historico:'Histórico do cliente',
  profissionais:'Profissionais',prof_form:'Cadastro de profissional',servicos:'Serviços',
  servico_form:'Cadastro de serviço',horarios:'Horários e bloqueios',relatorios:'Relatórios',
  usuarios:'Usuários e permissões',notificacoes:'Notificações',regras:'Regras aplicadas'};
var VIEWS={painel:vPainel,agenda:vAgenda,novo:vNovo,detalhe:vDetalhe,clientes:vClientes,cliente_form:vClienteForm,
  historico:vHistorico,profissionais:vProfissionais,prof_form:vProfForm,servicos:vServicos,servico_form:vServicoForm,
  horarios:vHorarios,relatorios:vRelatorios,usuarios:vUsuarios,notificacoes:vNotificacoes,regras:vRegras};

function menuHtml(){
  var h='<div class="side" id="side"><div class="logo">Agenda<span>Pro</span></div>';
  var grupoPendente=null;
  for(var i=0;i<MENU.length;i++){
    var m=MENU[i];
    if(m.grp){grupoPendente=m.grp;continue}
    if(m.p.indexOf(sessao.perfil)<0) continue;
    if(grupoPendente){h+='<div class="grp">'+grupoPendente+'</div>';grupoPendente=null}
    h+='<a class="'+(tela===m.t?'on':'')+'" onclick="ir(\''+m.t+'\',{})">'+m.r+'</a>';
  }
  return h+'</div>';
}
function render(){
  var raiz=document.getElementById('raiz');
  if(!sessao){raiz.innerHTML=vLogin();return}
  var f=VIEWS[tela]||vPainel;
  var perfilNome=sessao.perfil.charAt(0)+sessao.perfil.slice(1).toLowerCase();
  raiz.innerHTML='<div class="app">'+menuHtml()+'<div class="main">'+
    '<div class="top"><div style="display:flex;align-items:center;gap:10px">'+
      '<button class="menu-bt" onclick="alternarMenu()">&#9776;</button><h1>'+(TITULOS[tela]||'AgendaPro')+'</h1></div>'+
    '<div class="dir">Perfil: <b>'+perfilNome+'</b> | '+esc(sessao.nome)+
      ' <button class="bt bt-o bt-s" onclick="confirmarRestauro()">Restaurar demonstração</button>'+
      ' <button class="bt bt-o bt-s" onclick="sair()">Sair</button></div></div>'+
    '<div class="body">'+f()+'</div></div></div>';
}
function confirmarRestauro(){
  modal('<h3>Restaurar dados de demonstração?</h3><p>Todos os cadastros e agendamentos criados durante o uso serão '+
    'substituídos pelos dados iniciais do protótipo.</p><div class="acts">'+
    '<button class="bt bt-o" onclick="fecharModal()">Voltar</button>'+
    '<button class="bt bt-d" onclick="restaurar()">Restaurar</button></div>',true);
}

carregar();
render();
</script>
